server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Detrás de Traefik (HTTPS): una redirección de carpeta sin barra final
    # debe ser relativa, o nginx la mandaría a http://…:80/.
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
