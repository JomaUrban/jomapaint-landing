# Certificado HTTPS de paint.joma.es (manual).
# Lee en el log de Traefik qué pasó con el certificado, recrea solo el
# contenedor de JomaPaint para que Traefik vuelva a pedirlo a Let's Encrypt
# y comprueba el emisor desde fuera. No toca Traefik ni las otras webs del VPS.
# Ojo: si el primer intento de Let's Encrypt falló, recrear el contenedor con las
# mismas etiquetas no basta (la configuración no cambia y Traefik no reintenta);
# hay que cambiar alguna etiqueta del router en docker-compose.yml o reiniciar Traefik.
name: Certificado HTTPS

on:
  workflow_dispatch:
    inputs:
      solo_diagnostico:
        description: 'Solo diagnóstico: no recrear el contenedor'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cert:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ vars.VPS_HOST || '158.220.125.149' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/jomapaint-landing' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      DOMAIN: paint.joma.es
    steps:
      - name: Configurar SSH
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::Falta el secret VPS_SSH_KEY."; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          for i in 1 2 3 4 5; do
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            grep -q . ~/.ssh/known_hosts && break
            sleep $((i * 5))
          done
          cat > ~/.ssh/config <<SSHCFG
          Host deploy-target
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
            ConnectTimeout 20
          SSHCFG
          for i in 1 2 3 4 5; do ssh deploy-target true && exit 0; sleep $((i * 5)); done
          exit 1

      - name: Certificado actual
        run: |
          echo | openssl s_client -servername "$DOMAIN" -connect "$VPS_HOST:443" 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true

      - name: Diagnóstico de Traefik (solo lectura)
        run: |
          ssh deploy-target 'bash -s' <<'DIAG' || true
          echo "== Contenedores"; docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "== Argumentos de Traefik"; docker inspect traefik --format '{{json .Config.Cmd}}' 2>/dev/null
          echo "== Variables de Traefik (solo nombres)"; docker inspect traefik --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | cut -d= -f1 | grep -i 'TRAEFIK' || true
          echo "== Config estática"; docker exec traefik sh -c 'cat /etc/traefik/traefik.yml 2>/dev/null || cat /etc/traefik/traefik.toml 2>/dev/null' | grep -v -i 'email' | head -60
          echo "== certresolver por contenedor"; for c in $(docker ps -q); do docker inspect "$c" --format '{{.Name}}{{range $k,$v := .Config.Labels}}{{"\n  "}}{{$k}}={{$v}}{{end}}' | grep -iE '^/|certresolver|routers\..*\.rule|entrypoints'; done
          echo "== Dominios en el almacén ACME"; for f in /letsencrypt/acme.json /acme.json /etc/traefik/acme.json /etc/traefik/acme/acme.json /data/acme.json; do docker exec traefik sh -c "test -f $f && echo $f && grep -o '\"main\": *\"[^\"]*\"' $f" 2>/dev/null; done
          echo "== Errores y avisos de Traefik (48 h)"; docker logs traefik --since 48h 2>&1 | grep -E ' (ERR|WRN|ERROR|WARN) |level=(error|warning)' | grep -v 'Serving default' | tail -n 40
          echo "== Menciones a jomapaint (48 h)"; docker logs traefik --since 48h 2>&1 | grep -i 'jomapaint' | grep -v 'Configuration received' | grep -v '^{' | grep -v 'compress.go' | tail -n 20
          echo "== Inicio de Traefik"; docker inspect traefik --format '{{.State.StartedAt}}'
          echo "== Actividad ACME (desde el arranque)"; docker logs traefik 2>&1 | grep -iE 'acme|lego|challenge|obtain|certificate for domain|resolv' | grep -v 'Configuration received' | grep -v '^{' | grep -v 'Serving default' | cut -c1-400 | tail -n 60
          echo "== Fecha de los certificados del almacén"; docker exec traefik sh -c 'ls -la /letsencrypt/' 2>/dev/null
          DIAG

      - name: Log de Traefik (antes)
        if: ${{ !inputs.solo_diagnostico }}
        run: |
          ssh deploy-target "docker logs traefik --since 48h 2>&1 | grep -iE \"$DOMAIN\" | grep -iE 'acme|certif|error|unable|challenge|rate|limit' | tail -n 40" || true

      - name: Recrear el contenedor de JomaPaint
        if: ${{ !inputs.solo_diagnostico }}
        run: ssh deploy-target "cd '$VPS_PATH' && docker compose up -d --force-recreate web && docker compose ps"

      - name: Esperar el certificado de Let's Encrypt
        if: ${{ !inputs.solo_diagnostico }}
        run: |
          for i in $(seq 1 24); do
            ISSUER=$(echo | openssl s_client -servername "$DOMAIN" -connect "$VPS_HOST:443" 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || true)
            echo "[$i] $ISSUER"
            case "$ISSUER" in *"Let's Encrypt"*) echo "Certificado de Let's Encrypt activo."; exit 0;; esac
            sleep 10
          done
          echo "::error::Sigue sin certificado de Let's Encrypt tras 4 minutos."
          exit 1

      - name: Log de Traefik (después)
        if: ${{ always() && !inputs.solo_diagnostico }}
        run: |
          ssh deploy-target "docker logs traefik --since 6m 2>&1 | grep -iE \"$DOMAIN\" | grep -iE 'acme|certif|error|unable|challenge|rate|limit|obtain' | tail -n 40" || true

      - name: Comprobación final
        if: always()
        run: |
          echo | openssl s_client -servername "$DOMAIN" -connect "$VPS_HOST:443" 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
          curl -sS -o /dev/null -w "https://$DOMAIN -> %{http_code}\n" "https://$DOMAIN/" || true

      - name: Cerrar la conexión
        if: always()
        run: ssh -O exit deploy-target 2>/dev/null || true
