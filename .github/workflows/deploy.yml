# Despliegue a https://paint.joma.es en cada push a main.
# Necesita en Settings → Secrets and variables → Actions (de este repo o de la
# organización con acceso a este repo) el secret VPS_SSH_KEY, el mismo que usa
# Produccion-Joma. VPS_HOST / VPS_USER son opcionales: por defecto el VPS JOMA.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_LOGIN: ${{ vars.ODOO_LOGIN }}
      VPS_HOST: ${{ vars.VPS_HOST || '158.220.125.149' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/jomapaint-landing' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Configurar SSH
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Falta el secret VPS_SSH_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # el 22 del VPS rechaza conexiones a ratos: reintentar el keyscan
          for i in 1 2 3 4 5; do
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            grep -q . ~/.ssh/known_hosts && break
            sleep $((i * 5))
          done
          cat > ~/.ssh/config <<SSHCFG
          Host deploy-target
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 5m
            ConnectTimeout 20
          SSHCFG
          # una sola conexión reutilizada por todos los pasos (un handshake)
          for i in 1 2 3 4 5; do ssh deploy-target true && exit 0; sleep $((i * 5)); done
          exit 1

      - name: Sincronizar y desplegar
        run: |
          ssh deploy-target "mkdir -p '$VPS_PATH'"
          rsync -az --delete --exclude .git --exclude node_modules --exclude .env -e ssh ./ "deploy-target:$VPS_PATH/"
          # .env del servidor de solicitudes, desde secrets/variables de GitHub (no se guarda en el repo)
          {
            [ -n "$ODOO_API_KEY" ] && printf 'ODOO_API_KEY=%s\n' "$ODOO_API_KEY"
            [ -n "$ODOO_LOGIN" ] && printf 'ODOO_LOGIN=%s\n' "$ODOO_LOGIN"
            true
          } | ssh deploy-target "umask 077 && cat > '$VPS_PATH/.env'"
          ssh deploy-target "cd '$VPS_PATH' && docker compose up -d --build && docker compose ps"

      - name: Comprobar salud
        # 127.0.0.1 y no localhost: el wget de alpine prueba ::1 y nginx solo escucha IPv4
        run: ssh deploy-target "cd '$VPS_PATH' && for i in 1 2 3 4 5; do docker compose exec -T web wget -qO /dev/null http://127.0.0.1/ && docker compose exec -T api wget -qO- http://127.0.0.1:3000/api/salud && exit 0; sleep 3; done; docker compose logs --tail 30 web api; exit 1"

      - name: Avisar a Bing y a otros buscadores (IndexNow)
        # Bing alimenta también la búsqueda de ChatGPT y Copilot. Si falla, el despliegue sigue.
        continue-on-error: true
        run: |
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | cut -d. -f1)
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sed 's#^http://[^/]*/#https://paint.joma.es/#' | jq -R . | jq -sc .)
          jq -n --arg k "$KEY" --argjson u "$URLS" '{host:"paint.joma.es", key:$k, keyLocation:("https://paint.joma.es/"+$k+".txt"), urlList:$u}' > indexnow.json
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/IndexNow -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json

      - name: Cerrar la conexión
        if: always()
        run: ssh -O exit deploy-target 2>/dev/null || true
