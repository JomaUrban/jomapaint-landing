# Web JomaPaint — https://paint.joma.es
# La sirve el Traefik del VPS JOMA (158.220.125.149), el mismo que prod.joma.es:
# lee estas etiquetas en la red Docker externa `edge` y saca el certificado de
# Let's Encrypt. Sin puertos publicados: solo se entra por Traefik.
services:
  web:
    build: .
    restart: unless-stopped
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.jomapaint.rule: Host(`paint.joma.es`)
      traefik.http.routers.jomapaint.entrypoints: websecure
      traefik.http.routers.jomapaint.tls.certresolver: letsencrypt
      # Dominio explícito del certificado. Si Let's Encrypt falla (p. ej., el DNS aún
      # no existía), Traefik no lo reintenta hasta que cambia la configuración:
      # cambiar estas etiquetas o reiniciar Traefik fuerza un nuevo intento.
      traefik.http.routers.jomapaint.tls.domains[0].main: paint.joma.es
      traefik.http.routers.jomapaint.middlewares: jomapaint-headers,jomapaint-compress
      traefik.http.services.jomapaint.loadbalancer.server.port: "80"
      traefik.http.middlewares.jomapaint-compress.compress: "true"
      traefik.http.middlewares.jomapaint-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.jomapaint-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.jomapaint-headers.headers.referrerPolicy: strict-origin-when-cross-origin

  # Solicitudes de presupuesto: paint.joma.es/api/* → este contenedor.
  # Las claves llegan en .env (lo escribe el workflow Deploy desde los secrets de GitHub).
  api:
    build: ./api
    restart: unless-stopped
    networks:
      - edge
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-JomaPaint web <paint@joma.es>}
      MAIL_TO: ${MAIL_TO:-marimar@joma.es}
      ALLOWED_ORIGINS: https://paint.joma.es
    volumes:
      - solicitudes:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.jomapaint-api.rule: Host(`paint.joma.es`) && PathPrefix(`/api/`)
      traefik.http.routers.jomapaint-api.entrypoints: websecure
      traefik.http.routers.jomapaint-api.tls.certresolver: letsencrypt
      traefik.http.routers.jomapaint-api.tls.domains[0].main: paint.joma.es
      traefik.http.routers.jomapaint-api.middlewares: jomapaint-headers
      traefik.http.services.jomapaint-api.loadbalancer.server.port: "3000"

volumes:
  # Copia de cada solicitud y sus planos (aunque el correo falle).
  solicitudes:

networks:
  # Red del Traefik del VPS (la crea el stack de JomaUrban/Web-JomaUrban).
  edge:
    external: true
